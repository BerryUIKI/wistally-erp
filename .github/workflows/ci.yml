name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wistally_test
          MYSQL_USER: wistally
          MYSQL_PASSWORD: wistally
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uwistally -pwistally"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: mysql://wistally:wistally@localhost:3306/wistally_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Boundaries, lint, types
        run: |
          pnpm depcruise
          pnpm turbo run lint typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # Running twice proves migrations and seeds are idempotent.
      - name: Migration replay
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Seed idempotency
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration
