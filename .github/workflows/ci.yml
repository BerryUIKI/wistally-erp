name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wistally
          POSTGRES_PASSWORD: wistally
          POSTGRES_DB: wistally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wistally"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://wistally:wistally@localhost:5432/wistally_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Boundaries, lint, types
        run: |
          pnpm depcruise
          pnpm turbo run lint typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # Running twice proves migrations and seeds are idempotent.
      - name: Migration replay
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Seed idempotency
        run: |
          pnpm db:seed
          pnpm db:seed
